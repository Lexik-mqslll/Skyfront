modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-or-later"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Skyfront"
description='''
Modern drone warfare for Superb Warfare: recon and thermal quadcopters, FPV kamikaze drones, interceptors, the Molniya strike drone, Shahed launches, radar and air-raid sirens.
'''
logoFile="logo.png"
credits='Made for KrutEvent. Mavic 3 model: "DJI Mavic 3" by llirikslon (Sketchfab), CC BY 4.0.'
authors="${mod_authors}"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[4.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
mandatory=false
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="superbwarfare"
mandatory=true
versionRange="[0.8,)"
ordering="AFTER"
side="BOTH"
