pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// A build of its own rather than a subproject of the NeoForge one beside it: ForgeGradle and
// ModDevGradle each bring their own toolchain, and sharing one build's plugin classpath between
// them is asking for a version clash neither was written to expect.
rootProject.name = 'skyfront-forge-1.20.1'
